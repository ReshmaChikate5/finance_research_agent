[project]
name = "agentic-finance-agent"
version = "0.1.0"
description = "Agentic finance research assistant (LangGraph + MCP + AWS)"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "pre-commit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff.lint]
exclude = ["scaffold.py"]