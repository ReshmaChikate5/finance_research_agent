[project]
name = "agentic-finance-agent"
version = "0.1.0"
description = "Agentic finance research assistant (LangGraph + MCP + AWS)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]<2",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
local = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "mcp[cli]<2",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "asyncpg>=0.32.0",
    "starlette>=1.10.0",
    "pytest-cov>=7.1.0",
    "chromadb>=1.5.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["agent_host"]


[tool.ruff.lint]
exclude = ["scaffold.py"]

[tool.coverage.run]
source = ["mcp_servers"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
