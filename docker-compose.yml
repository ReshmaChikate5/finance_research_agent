services:
  agent_host:
    build: ./agent_host
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [sec_edgar, market_data, portfolio, notify_slack]

  sec_edgar:
    build: ./mcp_servers/sec_edgar
    ports: ["8001:8000"]
    env_file: .env

  market_data:
    build: ./mcp_servers/market_data
    ports: ["8002:8000"]
    env_file: .env

  portfolio:
    build: ./mcp_servers/portfolio
    ports: ["8003:8000"]
    env_file: .env

  notify_slack:
    build: ./mcp_servers/notify_slack
    ports: ["8004:8000"]
    env_file: .env
