[project]
name = "agent-host"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.159.1",
    "mcp",
    "pydantic-settings>=2.16.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
local = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "sentence-transformers>=6.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
